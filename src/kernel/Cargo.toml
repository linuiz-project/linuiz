[package]
name = "kernel"
version = "0.0.0"
edition = "2024"

[features]
default = ["panic_traces"]
panic_traces = ["dep:rustc-demangle"]

[dependencies]
acpi = "5.2"
bit_field = "0.10"
bitflags = "2.9"
elf = { version = "0.8.0", default-features = false }
getrandom = "0.3"
ioports = "1.0"
limine = { version = "0.5", features = ["uuid"] }
log = { version = "0.4", default-features = false }
num_enum = { version = "0.7", default-features = false }
paste = "1.0"
rand_pcg = { version = "0.9", default-features = false }
safe-mmio = "0.2"
spin = "0.10"
static_assertions = "1.1.0"
thiserror = { version = "2.0", default-features = false }
uart = { version = "3.0", default-features = false, features = [
    "address_impl",
] }
uuid = { version = "1.16", default-features = false, features = ["v4"] }

# source: git
acpica = { git = "https://github.com/linuiz-project/acpica", tag = "v0.1.1" }
bitmap = { git = "https://github.com/linuiz-project/bitmap", tag = "v0.1.0" }
libsys = { git = "https://github.com/linuiz-project/libsys", tag = "v0.3.4" }
slab_allocator = { git = "https://github.com/linuiz-project/slab_allocator", tag = "v0.2.0" }

# feature-specific
rustc-demangle = { version = "0.1", optional = true } # feature: panic_traces

[target.x86_64-unknown-none.dependencies]
raw-cpuid = "11.0"

[lints.rust]
dead_code = "allow"
mismatched_lifetime_syntaxes = "allow"
unsafe_op_in_unsafe_fn = "warn"
stable_features = "deny"
fuzzy_provenance_casts = "forbid"

[lints.clippy]
# allow
cargo_common_metadata = "allow"
enum_glob_use = "allow"
inline_always = "allow"
items_after_statements = "allow"
must_use_candidate = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
upper_case_acronyms = "allow"
missing_const_for_fn = "allow"
needless_for_each = "allow"
if_not_else = "allow"

# warn
todo = "warn"
cargo = "warn"
pedantic = "warn"
undocumented_unsafe_blocks = "warn"
semicolon_inside_block = "warn"
semicolon_if_nothing_returned = "warn"

# deny
debug_assert_with_mut_call = "deny"
float_arithmetic = "deny"
as_conversions = "deny"

# forbid
duplicated_attributes = "forbid"
inline_asm_x86_att_syntax = "forbid"
