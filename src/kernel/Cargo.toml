[package]
name = "kernel"
version = "0.0.0"
edition = "2024"

[dependencies]
# source: crates.io
limine = { version = "0.5", features = ["uuid"] }
log = { version = "0.4", default-features = false }
rand_pcg = { version = "0.9", default-features = false }
getrandom = "0.3"
num_enum = { version = "0.7", default-features = false }
uuid = { version = "1.16", default-features = false, features = ["v4"] }
elf = { version = "0.8.0", default-features = false }
bitvec = { version = "1.0", default-features = false, features = [
    "atomic",
    "alloc",
] }
uart = { version = "3.0", default-features = false, features = [
    "address_impl",
] }
ioports = "1.0"
spin = "0.10"
bit_field = "0.10"
bitflags = "2.9"
paste = "1.0"
thiserror = { version = "2.0", default-features = false }
zerocopy = { version = "0.8", features = ["derive", "alloc"] }
acpi = "5.2"

# source: git
libsys = { git = "https://github.com/linuiz-project/libsys", tag = "v0.1.3" }
acpica = { git = "https://github.com/linuiz-project/acpica" }
printf-compat = { git = "https://github.com/zdivelbiss/printf-compat", default-features = false }

# feature-specific
rustc-demangle = { version = "0.1", optional = true }


[target.x86_64-unknown-none.dependencies]
raw-cpuid = "11.0"

[features]
default = ["panic_traces"]
panic_traces = ["dep:rustc-demangle"]
