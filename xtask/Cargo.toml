[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lzma-rs = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
tar = { version = "0.4", default-features = false }
toml = "0.9"
xshell = "0.2"
